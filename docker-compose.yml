# OGAD pipeline: sigl → d3pm → ggme → digress (vanilla baseline)
#
#   docker compose up --build
#
# Debug un singolo servizio:
#   docker compose run --rm prep_data
#   docker compose run --rm train_model_a
#   docker compose run --rm train_model_b
#   docker compose run --rm eval_metrics

name: ogad

services:
  prep_data:
    image: mikymatt/ogad-prep-data:latest
    build: ./src/sigl
    shm_size: 2gb
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OGAD_GPU_ID:-0}"]
              capabilities: [gpu]

  train_model_a:
    depends_on:
      prep_data:
        condition: service_completed_successfully
    image: mikymatt/ogad-train-model-a:latest
    build:
      context: ./src/vanilla/DiGress
      dockerfile: dockerfile
    shm_size: 4gb
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OGAD_GPU_ID:-0}"]
              capabilities: [gpu]

  train_model_b:
    depends_on:
      train_model_a:
        condition: service_completed_successfully
    image: mikymatt/ogad-train-model-b:latest
    build: ./src/d3pm
    shm_size: 4gb
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OGAD_GPU_ID:-0}"]
              capabilities: [gpu]

  eval_metrics:
    depends_on:
      train_model_a:
        condition: service_completed_successfully
      train_model_b:
        condition: service_completed_successfully
    image: mikymatt/ogad-eval-metrics:latest
    build: ./src/ggme
    shm_size: 2gb
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OGAD_GPU_ID:-0}"]
              capabilities: [gpu]
