# OGAD pipeline: sigl → d3pm → ggme → digress (vanilla baseline)
#
#   docker compose up --build
#
# Debug un singolo servizio:
#   docker compose run --rm sigl
#   docker compose run --rm d3pm
#   docker compose run --rm ggme
#   docker compose run --rm digress

name: ogad

services:
  sigl:
    build: ./src/sigl
    shm_size: 2gb
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  d3pm:
    depends_on:
      sigl:
        condition: service_completed_successfully
    build: ./src/d3pm
    shm_size: 4gb
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  digress:
    depends_on:
      d3pm:
        condition: service_completed_successfully
    build:
      context: ./src/vanilla/DiGress
      dockerfile: dockerfile
    shm_size: 4gb
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ggme:
    depends_on:
      digress:
        condition: service_completed_successfully
    build: ./src/ggme
    shm_size: 2gb
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
