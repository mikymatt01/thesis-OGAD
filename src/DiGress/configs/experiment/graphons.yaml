# @package _global_
dataset:
  name: graphons
  remove_h: null
  data_root: ${oc.env:OGAD_DATA_DIR,../../../data}
  graphon_dir: train/graphons
  output_path: predictions/graphons/digress/tensors.pt
  stats_output_path: predictions/graphons/digress/stats.json
  codebook_path: predictions/graphons/digress/codebook.json
  candidate_dir: predictions/graphons/digress/candidates
  candidate_manifest_path: predictions/graphons/digress/candidates.json
  resolution: 128
  # 'codebook' fits the reconstruction levels to the training value
  # distribution (Lloyd-Max). 'uniform' reproduces the original evenly spaced
  # levels, which round the inter-community probability (~0.01) down to exactly
  # zero and split every generated graph into one component per community.
  quantization: codebook
  num_bins: 16
  # Rescaling every graphon to the mean training density also removes all
  # density variation between samples; only useful as a diagnostic.
  match_training_density: false
  split_seed: 0
  pin_memory: true

general:
  name: graphons
  gpus: 1
  wandb: offline
  resume: null
  test_only: null
  check_val_every_n_epochs: 10
  sample_every_val: 1000000
  samples_to_generate: 0
  samples_to_save: 0
  chains_to_save: 0
  # GGME cycles through these to build its 100 graphs, so fewer graphons means
  # less diversity for free.
  final_model_samples_to_generate: 100
  final_model_samples_to_save: 0
  final_model_chains_to_save: 0
  number_chain_steps: 10
  # Independent of train.batch_size: sampling is the memory peak of the run and
  # it happens after training, so an OOM here throws the whole run away.
  samples_batch_size: 8
  # Candidate export: GGME ranks these on its validation split and copies the
  # winner into tensors.pt, matching what the D3PM branch already gets. The
  # checkpoints are the ones save_top_k already keeps, so this costs sampling
  # time only (about 11 s per graphon), not training time.
  # 0 checkpoints disables it and falls back to a single test run.
  candidate_checkpoints: 5
  candidate_seeds: 3
  candidate_samples: 24
  # val NLL here is T * E_kl from a single noise draw; its noise is larger than
  # the improvement over training, so selecting on it picks an arbitrary epoch.
  monitor_metric: val/E_CE
  val_loss_repeats: 4

train:
  n_epochs: 600
  # The old batch_size 2 / accumulate 16 peaked at 1.3 GB on a 40 GB A100 while
  # running 16 optimizer steps per epoch. Same effective batch of 32, 8x fewer
  # forward passes, and enough headroom left for extra_features.
  batch_size: 16
  accumulate_grad_batches: 2
  # Keep at 0: main.py's ema_decay > 0 branch calls utils.EMA, which does not
  # exist in this fork (nor upstream), so any positive value crashes at startup.
  ema_decay: 0
  save_model: true

model:
  type: discrete
  # The bin marginal is heavily skewed; a uniform prior starts sampling from
  # mean value 0.5 against a data density of ~0.22.
  transition: marginal
  diffusion_steps: 1000
  diffusion_noise_schedule: cosine
  n_layers: 5
  lambda_train: [5, 0]
  # With a single node type these structural features are the only thing that
  # distinguishes one node from another.
  extra_features: all
  hidden_mlp_dims: {X: 128, E: 64, y: 128}
  hidden_dims:
    dx: 256
    de: 64
    dy: 64
    n_head: 8
    dim_ffX: 256
    dim_ffE: 64
    dim_ffy: 128
